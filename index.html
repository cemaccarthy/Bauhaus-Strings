<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ABC Guitar">

    <title>ABC Guitar Notator</title>

    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            color-scheme: light dark;

            --bauhaus-red: #E03C31;
            --bauhaus-blue: #004B8D;
            --bauhaus-yellow: #F2B705;
            --bauhaus-black: #111111;

            --bg-main: #F5F5F5;
            --bg-header: #111111;
            --text-header: #F5F5F5;
            --bg-editor: #FFFFFF;
            --bg-paper: #FFFFFF;

            --text-main: #111111;
            --border-color: #111111;
            --shadow-color: #111111;

            --toggle-off: #CCCCCC;
            --empty-state: #888888;

            --button-text: #FFFFFF;
            --stop-text: #FFFFFF;

            --syn-key: #C62828;
            --syn-value: #004B8D;
            --syn-bar: #A66A00;
            --syn-chord: #C62828;
            --syn-string: #004B8D;
            --syn-comment: #777777;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bauhaus-red: #FF5245;
                --bauhaus-blue: #4B8DFF;
                --bauhaus-yellow: #FFD033;
                --bauhaus-black: #000000;

                --bg-main: #121212;
                --bg-header: #000000;
                --text-header: #F5F5F5;
                --bg-editor: #1A1A1A;
                --bg-paper: #1E1E1E;

                --text-main: #F5F5F5;
                --border-color: #F5F5F5;
                --shadow-color: #000000;

                --toggle-off: #444444;
                --empty-state: #666666;

                --button-text: #000000;
                --stop-text: #000000;

                --syn-key: #FF6B6B;
                --syn-value: #74A9FF;
                --syn-bar: #FFD166;
                --syn-chord: #FF6B6B;
                --syn-string: #74A9FF;
                --syn-comment: #9A9A9A;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Futura", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-transform: uppercase;
        }

        header {
            background-color: var(--bg-header);
            border-bottom: 4px solid var(--bauhaus-yellow);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-header);
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            background: var(--bauhaus-blue);
            color: var(--button-text);
            border: 3px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 0;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--shadow-color);
            transition: transform 0.05s, box-shadow 0.05s, background-color 0.1s;
            text-transform: uppercase;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--shadow-color);
        }

        button.stop-btn {
            background: var(--bauhaus-red);
            color: var(--stop-text);
        }

        button:disabled {
            background: var(--toggle-off);
            color: var(--bg-main);
            border-color: var(--border-color);
            box-shadow: 4px 4px 0px var(--shadow-color);
            cursor: default;
        }

        button:disabled:active {
            transform: none;
            box-shadow: 4px 4px 0px var(--shadow-color);
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            border: 3px solid var(--border-color);
            padding: 8px 12px;
            background: var(--bg-main);
            color: var(--text-main);
            box-shadow: 4px 4px 0px var(--shadow-color);
        }

        .switch-container input {
            display: none;
        }

        .slider {
            width: 36px;
            height: 18px;
            background: var(--toggle-off);
            border: 2px solid var(--border-color);
            position: relative;
            transition: background 0.1s;
        }

        .slider::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--border-color);
            top: -2px;
            left: -2px;
            border: 2px solid var(--border-color);
            transition: transform 0.1s;
        }

        .switch-container input:checked + .slider {
            background: var(--bauhaus-red);
        }

        .switch-container input:checked + .slider::after {
            transform: translateX(18px);
            background: var(--bg-main);
        }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        .editor-pane {
            width: 35%;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            border-right: 4px solid var(--border-color);
            background: var(--bg-editor);
            position: relative;
            min-height: 0;
        }

        .editor-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .highlight-layer,
        textarea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.6;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            border: none;
            margin: 0;
            text-transform: none;
        }

        .highlight-layer {
            pointer-events: none;
            z-index: 1;
            color: var(--text-main);
            background: transparent;
        }

        textarea {
            z-index: 2;
            background: transparent;
            color: transparent;
            caret-color: var(--bauhaus-red);
            outline: none;
            resize: none;
        }

        textarea::placeholder {
            color: var(--empty-state);
            font-weight: normal;
            text-transform: none;
        }

        .hl-key {
            color: var(--syn-key);
            font-weight: 900;
        }

        .hl-val {
            color: var(--syn-value);
        }

        .hl-bar {
            color: var(--syn-bar);
            font-weight: 900;
        }

        .hl-chord {
            color: var(--syn-chord);
            font-weight: 900;
        }

        .hl-string {
            color: var(--syn-string);
        }

        .hl-comment {
            color: var(--syn-comment);
        }

        .preview-pane {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: var(--bg-main);
            display: flex;
            justify-content: center;
            min-height: 0;
        }

        #paper {
            width: 100%;
            max-width: 800px;
            background: var(--bg-paper);
            border: 4px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
            min-height: 200px;
        }

        #paper svg {
            max-width: 100%;
            height: auto;
        }

        @media (prefers-color-scheme: dark) {
            #paper svg path,
            #paper svg rect,
            #paper svg line {
                fill: var(--text-main) !important;
                stroke: var(--text-main) !important;
            }

            #paper svg text {
                fill: var(--text-main) !important;
            }
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 150px;
            font-weight: 800;
            color: var(--empty-state);
            letter-spacing: 4px;
            border: 4px dashed var(--empty-state);
        }

        .hide-tab .abcjs-tablature {
            display: none !important;
        }

        footer {
            background-color: var(--bg-header);
            border-top: 4px solid var(--bauhaus-yellow);
            padding: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 10;
        }

        footer button {
            flex: 1 1 160px;
            font-size: 0.72rem;
            padding: 12px 10px;
        }

        footer button.secondary {
            background: var(--bg-main);
            color: var(--text-main);
        }

        footer button.format {
            background: var(--bauhaus-yellow);
            color: #111111;
        }

        footer button.primary {
            background: var(--bauhaus-red);
            color: var(--stop-text);
        }

        @media (max-width: 800px) {
            main {
                flex-direction: column;
            }

            .editor-pane {
                width: 100%;
                height: 40%;
                min-width: unset;
                border-right: none;
                border-bottom: 4px solid var(--border-color);
            }

            .preview-pane {
                height: 60%;
                padding: 15px;
            }

            header {
                padding: 10px;
                flex-direction: column;
                gap: 10px;
            }

            footer button {
                flex: 1 1 45%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <svg width="40" height="40" viewBox="0 0 40 40" style="background:#FFFFFF; border: 3px solid #FFFFFF;">
                <circle cx="20" cy="20" r="12" fill="#E03C31"></circle>
                <path d="M20 8 L32 28 L8 28 Z" fill="#004B8D"></path>
                <line x1="14" y1="0" x2="14" y2="40" stroke="#111111" stroke-width="2"></line>
                <line x1="20" y1="0" x2="20" y2="40" stroke="#111111" stroke-width="2"></line>
                <line x1="26" y1="0" x2="26" y2="40" stroke="#111111" stroke-width="2"></line>
            </svg>
            <h1>ABC Guitar Notator</h1>
        </div>

        <div class="controls">
            <label class="switch-container">
                <input type="checkbox" id="tabToggle" checked>
                <span class="slider"></span> Show Tab
            </label>
            <button id="playBtn" disabled>Play</button>
            <button id="stopBtn" class="stop-btn" disabled>Stop</button>
        </div>
    </header>

    <main>
        <div class="editor-pane">
            <div class="editor-wrapper">
                <pre class="highlight-layer" id="highlightLayer"></pre>
                <textarea id="abcInput" spellcheck="false" placeholder="X:1
T:STUDY NO. 1
M:4/4
L:1/8
Q:1/4=80
K:C clef=treble
C2 E2 G2 c2 | e2 g2 c'4 |"></textarea>
            </div>
        </div>

        <div class="preview-pane" id="previewPane">
            <div id="paper">
                <div class="empty-state">AWAITING ABC INPUT</div>
            </div>
        </div>
    </main>

    <footer>
        <input type="file" id="fileInput" accept=".txt,.abc,text/plain" style="display:none;">
        <button id="openBtn">Open TXT / ABC</button>
        <button id="downloadAbcBtn" class="secondary">Download ABC</button>
        <button id="formatToggleBtn" class="format">Export: SVG</button>
        <button id="downloadScoreBtn" class="primary">Download Score</button>
    </footer>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const uiCtx = new AudioContext();

        let synth = null;
        let exportFormat = "svg";
        let currentFileName = "score";

        const highlightLayer = document.getElementById("highlightLayer");
        const abcInput = document.getElementById("abcInput");
        const paper = document.getElementById("paper");
        const previewPane = document.getElementById("previewPane");
        const playBtn = document.getElementById("playBtn");
        const stopBtn = document.getElementById("stopBtn");
        const tabToggle = document.getElementById("tabToggle");

        const fileInput = document.getElementById("fileInput");
        const openBtn = document.getElementById("openBtn");
        const downloadAbcBtn = document.getElementById("downloadAbcBtn");
        const formatToggleBtn = document.getElementById("formatToggleBtn");
        const downloadScoreBtn = document.getElementById("downloadScoreBtn");

        function playWoodblock() {
            try {
                if (uiCtx.state === "suspended") uiCtx.resume();

                const osc = uiCtx.createOscillator();
                const gain = uiCtx.createGain();
                const filter = uiCtx.createBiquadFilter();

                osc.type = "square";
                osc.frequency.setValueAtTime(400, uiCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, uiCtx.currentTime + 0.05);

                filter.type = "lowpass";
                filter.frequency.setValueAtTime(1000, uiCtx.currentTime);

                gain.gain.setValueAtTime(0.4, uiCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, uiCtx.currentTime + 0.08);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(uiCtx.destination);

                osc.start();
                osc.stop(uiCtx.currentTime + 0.08);
            } catch (error) {
                console.warn("UI audio error", error);
            }
        }

        function playStringThwack() {
            try {
                if (uiCtx.state === "suspended") uiCtx.resume();

                const osc = uiCtx.createOscillator();
                const gain = uiCtx.createGain();

                osc.type = "triangle";
                osc.frequency.setValueAtTime(150, uiCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, uiCtx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.6, uiCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, uiCtx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(uiCtx.destination);

                osc.start();
                osc.stop(uiCtx.currentTime + 0.15);
            } catch (error) {
                console.warn("UI audio error", error);
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function highlightLine(line) {
            if (/^\s*%/.test(line)) {
                return `<span class="hl-comment">${line}</span>`;
            }

            if (/^[A-Za-z]:/.test(line)) {
                const colonIndex = line.indexOf(":");
                const key = line.substring(0, colonIndex + 1);
                const value = line.substring(colonIndex + 1);

                return `<span class="hl-key">${key}</span><span class="hl-val">${value}</span>`;
            }

            return line.replace(/("[^"]*")|(\[)|(\])|(\|\]|\[\||\|)/g, function(match, str, open, close, bar) {
                if (str) {
                    return `<span class="hl-string">${str}</span>`;
                }

                if (open || close) {
                    return `<span class="hl-chord">${match}</span>`;
                }

                if (bar) {
                    return `<span class="hl-bar">${match}</span>`;
                }

                return match;
            });
        }

        function updateHighlight() {
            const text = abcInput.value;

            if (!text) {
                highlightLayer.innerHTML = "";
                return;
            }

            const escaped = escapeHtml(text);
            const lines = escaped.split("\n");
            const highlighted = lines.map(highlightLine).join("\n");

            highlightLayer.innerHTML = highlighted + "\n";

            highlightLayer.scrollTop = abcInput.scrollTop;
            highlightLayer.scrollLeft = abcInput.scrollLeft;
        }

        function getTablatureOption() {
            if (!tabToggle.checked) {
                return [];
            }

            return [
                {
                    instrument: "guitar",
                    tuning: ["E,", "A,", "D", "G", "B", "e"],
                    label: "TAB"
                }
            ];
        }

        function renderABC() {
            updateHighlight();

            if (synth) {
                try {
                    synth.stop();
                } catch (error) {}
                synth = null;
            }

            stopBtn.disabled = true;

            if (abcInput.value.trim() === "") {
                paper.innerHTML = '<div class="empty-state">AWAITING ABC INPUT</div>';
                playBtn.disabled = true;
                return;
            }

            playBtn.disabled = false;

            if (!tabToggle.checked) {
                previewPane.classList.add("hide-tab");
            } else {
                previewPane.classList.remove("hide-tab");
            }

            const renderOptions = {
                responsive: "resize",
                staffwidth: 800,
                tablature: getTablatureOption()
            };

            ABCJS.renderAbc("paper", abcInput.value, renderOptions);
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = filename;

            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(function() {
                URL.revokeObjectURL(url);
            }, 1000);
        }

        function updateExportLabel() {
            formatToggleBtn.textContent = "Export: " + exportFormat.toUpperCase();
        }

        function buildExportSvg() {
            if (!abcInput.value.trim()) {
                return null;
            }

            const holder = document.createElement("div");

            holder.style.position = "absolute";
            holder.style.left = "-10000px";
            holder.style.top = "0";
            holder.style.width = "800px";
            holder.style.background = "#FFFFFF";

            document.body.appendChild(holder);

            const renderOptions = {
                responsive: false,
                staffwidth: 800,
                tablature: getTablatureOption()
            };

            try {
                ABCJS.renderAbc(holder, abcInput.value, renderOptions);
            } catch (error) {
                holder.remove();
                return null;
            }

            const svg = holder.querySelector("svg");

            if (!svg) {
                holder.remove();
                return null;
            }

            const rect = svg.getBoundingClientRect();
            const width = Math.max(1, Math.ceil(rect.width));
            const height = Math.max(1, Math.ceil(rect.height));

            const clone = svg.cloneNode(true);

            clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
            clone.setAttribute("width", width);
            clone.setAttribute("height", height);

            if (!clone.getAttribute("viewBox")) {
                clone.setAttribute("viewBox", "0 0 " + width + " " + height);
            }

            const background = document.createElementNS("http://www.w3.org/2000/svg", "rect");

            background.setAttribute("x", "0");
            background.setAttribute("y", "0");
            background.setAttribute("width", width);
            background.setAttribute("height", height);
            background.setAttribute("fill", "#FFFFFF");

            clone.insertBefore(background, clone.firstChild);

            const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
            style.textContent = "svg { background: #FFFFFF; }";

            clone.insertBefore(style, clone.firstChild);

            const svgString = new XMLSerializer().serializeToString(clone);

            holder.remove();

            return {
                string: svgString,
                width: width,
                height: height
            };
        }

        async function downloadScore() {
            const exportData = buildExportSvg();

            if (!exportData) {
                alert("No score to export yet.");
                return;
            }

            if (exportFormat === "svg") {
                const svgFile = '<?xml version="1.0" encoding="UTF-8"?>\n' + exportData.string;
                const blob = new Blob([svgFile], { type: "image/svg+xml;charset=utf-8" });

                downloadBlob(blob, currentFileName + ".svg");
                return;
            }

            if (!window.jspdf || !window.jspdf.jsPDF) {
                alert("The PDF library is still loading. Try again.");
                return;
            }

            const svgBlob = new Blob([exportData.string], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            const image = new Image();

            await new Promise(function(resolve, reject) {
                image.onload = resolve;
                image.onerror = reject;
                image.src = url;
            });

            const scale = 2;
            const canvas = document.createElement("canvas");

            canvas.width = exportData.width * scale;
            canvas.height = exportData.height * scale;

            const context = canvas.getContext("2d");

            context.fillStyle = "#FFFFFF";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);

            URL.revokeObjectURL(url);

            const imageData = canvas.toDataURL("image/png");

            const jsPDF = window.jspdf.jsPDF;

            const pdf = new jsPDF({
                orientation: exportData.width > exportData.height ? "landscape" : "portrait",
                unit: "pt",
                format: [exportData.width, exportData.height]
            });

            pdf.addImage(imageData, "PNG", 0, 0, exportData.width, exportData.height);
            pdf.save(currentFileName + ".pdf");
        }

        abcInput.addEventListener("input", renderABC);

        abcInput.addEventListener("scroll", function() {
            highlightLayer.scrollTop = this.scrollTop;
            highlightLayer.scrollLeft = this.scrollLeft;
        });

        tabToggle.addEventListener("change", function() {
            playStringThwack();
            renderABC();
        });

        playBtn.addEventListener("click", async function() {
            playWoodblock();

            if (!abcInput.value.trim()) {
                return;
            }

            try {
                if (synth) {
                    try {
                        synth.stop();
                    } catch (error) {}
                }

                synth = new ABCJS.synth.CreateSynth();

                await synth.init({
                    visualSelection: "selection",
                    audioContext: new (window.AudioContext || window.webkitAudioContext)(),
                    options: {
                        chordsOff: true,
                        soundFontUrl: "https://paulrosen.github.io/midi-js-soundfonts/abcjs/",
                        soundFontVolumeMultiplier: 0.8,
                        program: 24,
                        transpose: -12
                    }
                });

                await synth.prime();
                synth.start();

                playBtn.disabled = true;
                stopBtn.disabled = false;
            } catch (error) {
                console.error("Playback error", error);
            }
        });

        stopBtn.addEventListener("click", function() {
            playWoodblock();

            if (synth) {
                try {
                    synth.stop();
                } catch (error) {}
            }

            playBtn.disabled = false;
            stopBtn.disabled = true;
        });

        openBtn.addEventListener("click", function() {
            playWoodblock();
            fileInput.click();
        });

        fileInput.addEventListener("change", function() {
            const file = this.files[0];

            if (!file) {
                return;
            }

            currentFileName = file.name.replace(/\.[^/.]+$/, "") || "score";

            const reader = new FileReader();

            reader.onload = function(event) {
                abcInput.value = event.target.result;
                renderABC();
            };

            reader.readAsText(file);

            this.value = "";
        });

        downloadAbcBtn.addEventListener("click", function() {
            playWoodblock();

            if (!abcInput.value.trim()) {
                alert("Nothing to download yet.");
                return;
            }

            const blob = new Blob([abcInput.value], { type: "text/plain;charset=utf-8" });

            downloadBlob(blob, currentFileName + ".abc");
        });

        formatToggleBtn.addEventListener("click", function() {
            playWoodblock();

            if (exportFormat === "svg") {
                exportFormat = "pdf";
            } else {
                exportFormat = "svg";
            }

            updateExportLabel();
        });

        downloadScoreBtn.addEventListener("click", async function() {
            playWoodblock();

            try {
                await downloadScore();
            } catch (error) {
                console.error("Export error", error);
                alert("Export failed. Try again.");
            }
        });

        updateExportLabel();
        renderABC();
    </script>
</body>
</html>
